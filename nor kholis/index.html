<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Logo NOR KHOLIS</title>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body {
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background: #020403;
        font-family: Arial, sans-serif;
    }

    .logo {
        position: relative;
        width: 600px;
        max-width: 90%;
        padding: 55px 30px;
        text-align: center;
        overflow: hidden;
        border: 2px solid #39ff14;
        border-radius: 25px;
        background:
            radial-gradient(circle at center,
            rgba(57,255,20,.15),
            transparent 55%),
            #050805;

        box-shadow:
            0 0 20px rgba(57,255,20,.35),
            inset 0 0 40px rgba(57,255,20,.08);
    }

    /* GARIS DEKORASI */
    .logo::before,
    .logo::after {
        content: "";
        position: absolute;
        width: 180px;
        height: 3px;
        background: #39ff14;
        box-shadow: 0 0 15px #39ff14;
    }

    .logo::before {
        top: 25px;
        left: 30px;
        transform: skewX(-45deg);
    }

    .logo::after {
        bottom: 25px;
        right: 30px;
        transform: skewX(-45deg);
    }

    .crown {
        font-size: 45px;
        color: #39ff14;
        text-shadow:
            0 0 8px #39ff14,
            0 0 25px #39ff14;
        margin-bottom: 8px;
    }

    .nor {
        position: relative;
        font-size: 75px;
        font-weight: 1000;
        font-style: italic;
        letter-spacing: 12px;
        color: #050505;

        -webkit-text-stroke: 2px #39ff14;

        text-shadow:
            3px 3px 0 #0b6b08,
            0 0 10px #39ff14,
            0 0 30px rgba(57,255,20,.7);
    }

    .kholis {
        position: relative;
        margin-top: -5px;
        font-size: 62px;
        font-weight: 1000;
        font-style: italic;
        letter-spacing: 5px;

        background: linear-gradient(
            180deg,
            #b7ff9e 0%,
            #39ff14 35%,
            #0b7d08 70%,
            #020402 100%
        );

        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;

        filter:
            drop-shadow(0 0 5px #39ff14)
            drop-shadow(0 0 15px rgba(57,255,20,.7));
    }

    .slash {
        position: absolute;
        width: 320px;
        height: 5px;
        background: #39ff14;
        box-shadow: 0 0 15px #39ff14;
        transform: rotate(-8deg);
    }

    .slash.one {
        left: -80px;
        top: 48%;
    }

    .slash.two {
        right: -80px;
        top: 55%;
    }

    .subtitle {
        margin-top: 22px;
        color: #6eff52;
        font-size: 12px;
        font-weight: bold;
        letter-spacing: 6px;
        text-transform: uppercase;
    }

    .spark {
        position: absolute;
        color: #39ff14;
        font-size: 25px;
        text-shadow: 0 0 15px #39ff14;
    }

    .s1 {
        top: 35%;
        left: 12%;
    }

    .s2 {
        top: 25%;
        right: 12%;
    }

    .s3 {
        bottom: 25%;
        left: 20%;
    }

    .s4 {
        bottom: 20%;
        right: 18%;
    }

    /* RESPONSIVE */
    @media(max-width:600px) {

        .logo {
            padding: 45px 15px;
        }

        .nor {
            font-size: 50px;
            letter-spacing: 7px;
        }

        .kholis {
            font-size: 38px;
            letter-spacing: 2px;
        }

        .crown {
            font-size: 35px;
        }

        .subtitle {
            font-size: 8px;
            letter-spacing: 3px;
        }
    }
</style>
</head>

<body>

<div class="logo">

    <div class="slash one"></div>
    <div class="slash two"></div>

    <div class="spark s1">✦</div>
    <div class="spark s2">✧</div>
    <div class="spark s3">✦</div>
    <div class="spark s4">✧</div>

    <div class="crown">♛</div>

    <div class="nor">NOR</div>
    <div class="kholis">KHOLIS</div>

    <div class="subtitle">
        MIKROTIK • NETWORK • TRAINING
    </div>

</div>

</body>
</html>
